name: HA local integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wa_ha_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U wa_ha_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HA_TEST_EXPECTED_DATA_DIR: /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:ha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ha-simulation
          path: _state/wa-ha-phase1-simulation.jsonl
          if-no-files-found: ignore

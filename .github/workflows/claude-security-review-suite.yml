name: Claude Security Review
permissions:
  contents: read
  pull-requests: write
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.head_sha }}
        fetch-depth: 2
        persist-credentials: false
    - uses: anthropics/claude-code-security-review@main
      with:
        comment-pr: true
        claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
        exclude-directories: dist,node_modules,public,build
'on':
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

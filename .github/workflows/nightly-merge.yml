# nightly-merge — merges PRs Nizan approved in otomator-admin ("Night releases"), 23:15 Asia/Jerusalem.
# Every 30 minutes: reports this repo's open PRs to the release-ops Edge Function (admin shows them).
# 23:15 IL: asks release-ops which PRs are approved for tonight (each approval pinned to a head SHA),
#           merges them one by one (10 min apart), dispatches the deploy workflow if set, reports results.
# Weekend (Thu 23:00-Sun 08:00 IL): the half-hour cron also runs approved merges.
# Day path (every 30 min): PRs Nizan marked "merge now" are merged during the day ONLY if the repo has day merges
# enabled in admin AND the PR re-classifies (from the base branch, right now) as L0/L1 via release-level.sh.
# Approval lives ONLY in otomator-admin. Agents never approve, never edit this file to weaken it.
name: nightly-merge

on:
  schedule:
    - cron: '5,35 * * * *'     # sync + weekend merges / day-merge check every 30 min
    - cron: '15 20,21 * * *'   # 23:15 IL (20:15 UTC summer / 21:15 UTC winter; script checks IL hour)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [sync, merge]
        default: sync

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: nightly-merge
  cancel-in-progress: false

env:
  PROD_BRANCH: master
  DEPLOY_WORKFLOW: ''
  GATE_WORKFLOW: 'release-window.yml'
  GAP_SECONDS: '600'

jobs:
  run:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      issues: write
      actions: write
      checks: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROD_BRANCH }}
          fetch-depth: 0
      - name: Sync / prepare release plan
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPS_URL: ${{ vars.RELEASE_OPS_URL }}
          OPS_SECRET: ${{ secrets.RELEASE_OPS_SECRET }}
        run: |
          set -euo pipefail
          il_hour() { h=$(TZ=Asia/Jerusalem date +%H); echo $((10#$h)); }
          il_dow() { TZ=Asia/Jerusalem date +%u; }
          in_weekend_window() {
            local h d; h=$(il_hour); d=$(il_dow)
            [ "$d" -eq 4 ] && [ "$h" -ge 23 ] && return 0
            { [ "$d" -eq 5 ] || [ "$d" -eq 6 ]; } && return 0
            [ "$d" -eq 7 ] && [ "$h" -lt 8 ] && return 0
            return 1
          }
          in_window() {
            local h; h=$(il_hour)
            { [ "$h" -ge 23 ] || [ "$h" -lt 6 ]; } && return 0
            in_weekend_window
          }
          ops() { # $1 = JSON body; prints response
            curl -sS --fail-with-body -m 30 -X POST "$OPS_URL" \
              -H 'content-type: application/json' -H "x-release-secret: $OPS_SECRET" -d "$1"
          }
          if [ -z "${OPS_URL:-}" ] || [ -z "${OPS_SECRET:-}" ]; then
            echo "::notice::RELEASE_OPS_URL / RELEASE_OPS_SECRET not set yet — nothing to do."; exit 0
          fi

          mode=sync
          if [ "$EVENT" = "workflow_dispatch" ]; then mode="${INPUT_MODE:-sync}"; fi
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "15 20,21 * * *" ]; then
            if [ "$(il_hour)" -eq 23 ]; then mode=merge; else echo "Not 23:xx IL (DST twin cron) — skip."; exit 0; fi
          fi
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "5,35 * * * *" ] && in_window; then
            mode=merge
          fi

          # ---------- sync: report open PRs ----------
          prs=$(gh pr list --base "$PROD_BRANCH" --state open --limit 100 \
                 --json number,title,author,url,headRefOid,isDraft,labels,mergeStateStatus,updatedAt,body \
                 --jq '[.[] | {number,title,author:.author.login,url,head_sha:.headRefOid,draft:.isDraft,
                        labels:[.labels[].name],merge_state:.mergeStateStatus,updated_at:.updatedAt,body:(.body // ""),
                        release_manual:((.body // "") | test("(?im)^\\s*Release:\\s*manual\\b"))}]')
          sync_result=$(ops "$(jq -nc --arg repo "$REPO" --arg b "$PROD_BRANCH" --arg u "$RUN_URL" --argjson prs "$prs" '{action:"sync",repo:$repo,base:$b,run_url:$u,prs:$prs}')")
          node .github/scripts/reconcile-release-prs.mjs "$sync_result"
          echo "Synced $(jq length <<<"$prs") open PR(s)."
          while IFS= read -r item; do
            [ -n "$item" ] || continue
            n=$(jq -r .number <<<"$item"); sha=$(jq -r .head_sha <<<"$item")
            file_data=$(gh api --paginate --slurp "repos/$REPO/pulls/$n/files?per_page=100" | jq -c 'add | map({path:.filename,status:.status,blob_sha:.sha})')
            files=$(jq -c '[.[].path]' <<<"$file_data")
            removed=$(jq -c '[.[] | select(.status == "removed") | .path]' <<<"$file_data")
            migrations='[]'
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              path=$(jq -r .path <<<"$file"); blob=$(jq -r .blob_sha <<<"$file")
              sql=$(gh api "repos/$REPO/git/blobs/$blob" --jq .content | base64 -d)
              migrations=$(jq -cn --argjson old "$migrations" --arg path "$path" --arg sql "$sql" '$old + [{path:$path,sql:$sql}]')
            done < <(jq -c '.[] | select(.status != "removed" and (.path | test("^supabase/migrations/[0-9]{14}_.+\\.sql$")))' <<<"$file_data")
            ops "$(jq -nc --arg repo "$REPO" --argjson n "$n" --arg sha "$sha" --argjson files "$files" --argjson removed "$removed" --argjson migrations "$migrations" '{action:"sync_detail",repo:$repo,number:$n,head_sha:$sha,files:$files,removed_files:$removed,migrations:$migrations}')" >/dev/null
          done < <(jq -c '.[]' <<<"$prs")
          if [ "$mode" != "merge" ]; then
            # ---------- day path: "merge now" approvals, L0/L1 only ----------
            in_window && exit 0   # scheduled window runs handle approved releases
            dplan=$(ops "$(jq -nc --arg repo "$REPO" '{action:"plan",repo:$repo,mode:"day"}')")
            [ "$(jq -r '.day_enabled // false' <<<"$dplan")" = "true" ] || exit 0
            [ "$(jq -r '.paused // false' <<<"$dplan")" = "true" ] && exit 0
            [ "$(jq '.approved_now // [] | length' <<<"$dplan")" -gt 0 ] || exit 0
            printf '%s\n' "$dplan" > "$RUNNER_TEMP/release-gate-day-plan.json"
            mode=day
          fi
          echo "phase=$mode" >> "$GITHUB_OUTPUT"
      - name: Merge approved releases
        if: steps.sync.outputs.phase == 'day' || steps.sync.outputs.phase == 'merge'
        timeout-minutes: ${{ steps.sync.outputs.phase == 'day' && 50 || 120 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPS_URL: ${{ vars.RELEASE_OPS_URL }}
          OPS_SECRET: ${{ secrets.RELEASE_OPS_SECRET }}
          MODE: ${{ steps.sync.outputs.phase }}
          RELEASE_GATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          il_hour() { h=$(TZ=Asia/Jerusalem date +%H); echo $((10#$h)); }
          il_dow() { TZ=Asia/Jerusalem date +%u; }
          in_weekend_window() {
            local h d; h=$(il_hour); d=$(il_dow)
            [ "$d" -eq 4 ] && [ "$h" -ge 23 ] && return 0
            { [ "$d" -eq 5 ] || [ "$d" -eq 6 ]; } && return 0
            [ "$d" -eq 7 ] && [ "$h" -lt 8 ] && return 0
            return 1
          }
          in_window() {
            local h; h=$(il_hour)
            { [ "$h" -ge 23 ] || [ "$h" -lt 6 ]; } && return 0
            in_weekend_window
          }
          ops() { # $1 = JSON body; prints response
            curl -sS --fail-with-body -m 30 -X POST "$OPS_URL" \
              -H 'content-type: application/json' -H "x-release-secret: $OPS_SECRET" -d "$1"
          }
          if [ "$MODE" = "day" ]; then
            : "${RELEASE_GATE_TOKEN:?Workflow GITHUB_TOKEN missing}"
            in_window && exit 0
            dplan=$(cat "$RUNNER_TEMP/release-gate-day-plan.json")
            dres='[]'
            dadd() { dres=$(jq -c --argjson n "$1" --arg sha "$2" --arg o "$3" --arg r "$4" --arg m "${5:-}" \
                     '. + [{number:$n,approved_sha:$sha,outcome:$o,reason:($r|gsub("[\\r\\n|]+";" ")),merge_sha:$m}]' <<<"$dres"); echo "DAY PR #$1: $3 — $4"; }
            while read -r item; do
              [ -n "$item" ] || continue
              n=$(jq -r .number <<<"$item"); sha=$(jq -r .head_sha <<<"$item")
              pr=$(gh pr view "$n" --json state,headRefOid,mergeStateStatus,isDraft,baseRefName)
              if [ "$(jq -r .state <<<"$pr")" != "OPEN" ] || [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then dadd "$n" "$sha" skipped "not open / draft"; continue; fi
              if [ "$(jq -r .baseRefName <<<"$pr")" != "$PROD_BRANCH" ]; then dadd "$n" "$sha" skipped "base is not $PROD_BRANCH"; continue; fi
              if [ "$(jq -r .headRefOid <<<"$pr")" != "$sha" ]; then dadd "$n" "$sha" skipped "new commits after approval — re-approve"; continue; fi
              git fetch -q origin "pull/$n/head:pr-$n"
              lvl=$(BASE="$PROD_BRANCH" HEAD_REF="pr-$n" DRY_RUN=1 bash .github/scripts/release-level.sh | sed -n 's/^LEVEL=//p')
              if [ -z "$lvl" ] || [ "$lvl" -gt 1 ]; then dadd "$n" "$sha" skipped "level L${lvl:-?} — not allowed during the day, stays for the night"; continue; fi
              GH_TOKEN="$RELEASE_GATE_TOKEN" gh api -X POST "repos/$REPO/statuses/$sha" -f state=success -f context=release-window -f description="Day release approved in admin (L$lvl)" -f target_url="$RUN_URL" >/dev/null
              sleep 20
              ms=$(gh pr view "$n" --json mergeStateStatus --jq .mergeStateStatus)
              case "$ms" in CLEAN|HAS_HOOKS|UNSTABLE) ;; *) dadd "$n" "$sha" skipped "not mergeable: $ms"; continue;; esac
              if out=$(gh pr merge "$n" --merge --match-head-commit "$sha" 2>&1); then
                msha=$(gh pr view "$n" --json mergeCommit --jq '.mergeCommit.oid // ""'); note="day merge (L$lvl) by nightly-merge ($RUN_URL)"
                if [ -n "$DEPLOY_WORKFLOW" ]; then gh workflow run "$DEPLOY_WORKFLOW" --ref "$PROD_BRANCH" && note="$note; deploy dispatched" || note="$note; DEPLOY DISPATCH FAILED"; fi
                gh pr comment "$n" --body "☀️ Day release: $note" >/dev/null || true
                dadd "$n" "$sha" merged "$note" "$msha"
              else
                dadd "$n" "$sha" failed "$(tail -c 300 <<<"$out")"
              fi
            done < <(jq -c '.approved_now // [] | .[]' <<<"$dplan")
            if [ "$(jq length <<<"$dres")" -gt 0 ]; then
              ops "$(jq -nc --arg repo "$REPO" --arg u "$RUN_URL" --argjson r "$dres" '{action:"report",repo:$repo,run_url:$u,paused:false,mode:"day",results:$r}')" >/dev/null
            fi
            exit 0
          fi

          # ---------- merge ----------
          if ! in_window; then echo "::warning::Outside nightly 23:00-06:00 / weekend Thu 23:00-Sun 08:00 IL — merge mode refused."; exit 0; fi
          plan=$(ops "$(jq -nc --arg repo "$REPO" '{action:"plan",repo:$repo}')")
          # Keep the admin's existing max_per_night setting as a cap per window run.
          paused=$(jq -r '.paused // false' <<<"$plan"); max=$(jq -r '.max_per_night // 5' <<<"$plan")
          [ "$(jq '.approved // [] | length' <<<"$plan")" -gt 0 ] || exit 0
          results='[]'
          add() { results=$(jq -c --argjson n "$1" --arg sha "$2" --arg o "$3" --arg r "$4" --arg m "${5:-}" \
                   '. + [{number:$n,approved_sha:$sha,outcome:$o,reason:($r|gsub("[\\r\\n|]+";" ")),merge_sha:$m}]' <<<"$results"); echo "PR #$1: $3 — $4"; }
          if [ "$paused" = "true" ]; then
            ops "$(jq -nc --arg repo "$REPO" --arg u "$RUN_URL" '{action:"report",repo:$repo,run_url:$u,paused:true,results:[]}')" >/dev/null
            echo "Paused in admin."; exit 0
          fi
          if [ -n "$GATE_WORKFLOW" ]; then gh workflow run "$GATE_WORKFLOW" --ref "$PROD_BRANCH" || true; sleep 90; fi
          merged=0; first=1
          while read -r item; do
            [ -n "$item" ] || continue
            n=$(jq -r .number <<<"$item"); sha=$(jq -r .head_sha <<<"$item")
            if [ "$merged" -ge "$max" ]; then add "$n" "$sha" skipped "window run limit ($max) reached"; continue; fi
            pr=$(gh pr view "$n" --json state,headRefOid,mergeStateStatus,isDraft,baseRefName)
            st=$(jq -r .state <<<"$pr"); head=$(jq -r .headRefOid <<<"$pr"); ms=$(jq -r .mergeStateStatus <<<"$pr")
            if [ "$ms" = "UNKNOWN" ]; then sleep 15; pr=$(gh pr view "$n" --json state,headRefOid,mergeStateStatus,isDraft,baseRefName); ms=$(jq -r .mergeStateStatus <<<"$pr"); fi
            if [ "$ms" = "BLOCKED" ]; then sleep 120; ms=$(gh pr view "$n" --json mergeStateStatus --jq .mergeStateStatus); fi
            if [ "$st" != "OPEN" ]; then add "$n" "$sha" skipped "PR is $st"; continue; fi
            if [ "$(jq -r .baseRefName <<<"$pr")" != "$PROD_BRANCH" ]; then add "$n" "$sha" skipped "base is not $PROD_BRANCH"; continue; fi
            if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then add "$n" "$sha" skipped "draft"; continue; fi
            if [ "$head" != "$sha" ]; then add "$n" "$sha" skipped "new commits after approval ($head) — re-approve"; continue; fi
            case "$ms" in CLEAN|HAS_HOOKS|UNSTABLE) ;; *) add "$n" "$sha" skipped "not mergeable: $ms"; continue;; esac
            if [ "$first" -eq 0 ]; then sleep "$GAP_SECONDS"; fi
            first=0
            # Re-check after the gap; serialized cron runs may receive a stale plan.
            if ! in_window; then add "$n" "$sha" skipped "release window ended"; continue; fi
            pr=$(gh pr view "$n" --json state,headRefOid,isDraft,baseRefName)
            if [ "$(jq -r .state <<<"$pr")" != "OPEN" ]; then add "$n" "$sha" skipped "PR is no longer open"; continue; fi
            if [ "$(jq -r .headRefOid <<<"$pr")" != "$sha" ]; then add "$n" "$sha" skipped "new commits after approval — re-approve"; continue; fi
            if [ "$(jq -r .isDraft <<<"$pr")" = "true" ] || [ "$(jq -r .baseRefName <<<"$pr")" != "$PROD_BRANCH" ]; then add "$n" "$sha" skipped "draft / base changed"; continue; fi
            if out=$(gh pr merge "$n" --merge --match-head-commit "$sha" 2>&1); then
              msha=$(gh pr view "$n" --json mergeCommit --jq '.mergeCommit.oid // ""')
              merged=$((merged+1))
              note="merged by nightly-merge ($RUN_URL)"
              if [ -n "$DEPLOY_WORKFLOW" ]; then
                if gh workflow run "$DEPLOY_WORKFLOW" --ref "$PROD_BRANCH"; then note="$note; deploy dispatched"; else note="$note; DEPLOY DISPATCH FAILED"; fi
              fi
              [ "$ms" = "UNSTABLE" ] && note="$note; non-required checks failing"
              gh pr comment "$n" --body "🌙 Night release: $note" >/dev/null || true
              add "$n" "$sha" merged "$note" "$msha"
            else
              add "$n" "$sha" failed "$(tail -c 300 <<<"$out")"
            fi
          done < <(jq -c '.approved // [] | .[]' <<<"$plan")
          ops "$(jq -nc --arg repo "$REPO" --arg u "$RUN_URL" --argjson r "$results" '{action:"report",repo:$repo,run_url:$u,paused:false,results:$r}')" >/dev/null
          { echo "### Night release $(TZ=Asia/Jerusalem date '+%F %H:%M') IL"; echo; echo '| PR | outcome | reason |'; echo '|---|---|---|';
            jq -r '.[] | "| #\(.number) | \(.outcome) | \(.reason) |"' <<<"$results"; } >> "$GITHUB_STEP_SUMMARY"
